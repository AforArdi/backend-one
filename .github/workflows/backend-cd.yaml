name: Docker Depoy

on:
  workflow_run:
    workflows:
      - "Code Quality Check"
    types:
      - completed

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'

    name: Deploy to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Docker Build
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/rise-together-backend:latest .

      - name: Docker Push
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/rise-together-backend:latest

      - name: Deploy on Render
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_WEBHOOK_URL }}"